name: Mac tester feedback
description: Tell us how your first ten minutes with MailCraft went.
title: "Mac trial: "
labels: ["tester"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying MailCraft. See the [ten-minute trial guide](https://github.com/daviddaryl-sys/mailcraft/blob/main/TESTING.md) for downloads and installation help.
        This issue is public. Do not include passwords, tokens, account addresses, private mail or unredacted screenshots. An interface-only trial is welcome; connecting an account is optional.
  - type: dropdown
    id: chip
    attributes:
      label: Mac type
      options:
        - Apple Silicon (M1 or newer)
        - Intel
        - Not sure
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: From Apple menu > About This Mac
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: How far did you get?
      options:
        - Downloaded but could not install
        - Installed but could not open
        - Opened and explored the interface or sample
        - Connected a dedicated test mailbox
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What worked, and where did you get stuck?
      description: Include the step you tried and the result. Remove any private details.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What one change would make you try it again?
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: This report contains no passwords, tokens, private messages or account addresses.
          required: true
